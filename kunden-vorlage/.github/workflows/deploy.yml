name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    # Die Vorlage selbst wird nie veröffentlicht, nur die daraus erzeugten Kunden-Repos.
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/technik.test.mjs

      - name: Live (main)
        if: github.ref_name == 'main'
        run: npx wrangler deploy

      # Eine Preview-Version ändert die Live-Seite nicht; sie bekommt eine feste URL staging-<name>.<subdomain>.workers.dev
      - name: Vorschau (staging)
        if: github.ref_name == 'staging'
        run: npx wrangler versions upload --preview-alias staging
